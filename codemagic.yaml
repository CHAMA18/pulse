# Pulse desktop releases — installers are built on Codemagic's macOS runner.
# Builds are triggered by the Codemagic REST API, so no branch or tag triggers
# are defined here; the API passes the branch explicitly.
#
# Optional code signing: add CSC_LINK/CSC_KEY_PASSWORD (and APPLE_ID,
# APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID for notarization) to the Codemagic
# environment. Without them the macOS app is ad-hoc signed so it is not reported
# as damaged, and the Windows build is unsigned.
workflows:
  pulse_macos:
    name: Pulse for macOS
    instance_type: mac_mini_m2
    max_build_duration: 90
    environment:
      node: lts
      vars:
        NEXT_EXPORT: "1"
        NEXT_DESKTOP: "1"
        NEXT_TELEMETRY_DISABLED: "1"
    scripts:
      - name: Install web dependencies
        script: npm install --no-audit --no-fund
      - name: Install Cloud Functions types
        script: npm install --prefix functions --no-audit --no-fund
      - name: Install desktop packaging tools
        script: npm install --prefix desktop --include=dev --no-audit --no-fund
      - name: Generate application icons
        script: npm run desktop:icons
      - name: Build static web export
        script: npx next build
      - name: Stage desktop assets
        script: npm run desktop:stage
      - name: Package macOS app
        script: npm --prefix desktop run dist:mac
      - name: Verify macOS app signature
        script: |
          APP="desktop/release/mac-universal/Pulse.app"
          test -d "$APP"
          codesign --verify --deep --strict "$APP"
          codesign -dv "$APP" 2>&1 | grep -E 'Identifier|Signature|TeamIdentifier'
    artifacts:
      - desktop/release/*.dmg
      - desktop/release/*.zip

  pulse_windows:
    name: Pulse for Windows
    # Windows machines aren't on this account's plan, so the portable Windows
    # build is packaged on the available macOS runner (as the Quorum project does).
    instance_type: mac_mini_m2
    max_build_duration: 90
    environment:
      node: lts
      vars:
        NEXT_EXPORT: "1"
        NEXT_DESKTOP: "1"
        NEXT_TELEMETRY_DISABLED: "1"
    scripts:
      - name: Install web dependencies
        script: npm install --no-audit --no-fund
      - name: Install Cloud Functions types
        script: npm install --prefix functions --no-audit --no-fund
      - name: Install desktop packaging tools
        script: npm install --prefix desktop --include=dev --no-audit --no-fund
      - name: Generate application icons
        script: npm run desktop:icons
      - name: Build static web export
        script: npx next build
      - name: Stage desktop assets
        script: npm run desktop:stage
      - name: Package Windows app
        script: npm --prefix desktop run dist:win
      - name: Verify Windows artifacts
        script: test -n "$(find desktop/release -maxdepth 1 -name '*.exe' -print -quit)"
    artifacts:
      - desktop/release/*.exe
      - desktop/release/*.zip
